<template>
  <style>
    @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    /* the ground has a hole in the middle that opens onto the next scene during the zoom-through */
    #ring-ground { position: absolute; inset: 0; background: #050507; --hole: 0px;
      -webkit-mask-image: radial-gradient(circle at 960px 520px, transparent var(--hole), #000 calc(var(--hole) + 2px));
      mask-image: radial-gradient(circle at 960px 520px, transparent var(--hole), #000 calc(var(--hole) + 2px)); }
    #ring-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #ring-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #ring-track { fill: none; stroke: #2c2830; stroke-width: 4; }
    #ring-arc { fill: none; stroke: url(#ring-grad); stroke-width: 16; stroke-linecap: round; }
    #ring-num { position: absolute; left: 0; top: 440px; width: 1920px; text-align: center; font-family: "Fraunces", serif; font-weight: 300;
      font-size: 150px; letter-spacing: -0.02em; color: #f6e7c1; line-height: 1; font-variant-numeric: tabular-nums; }
    #ring-lbl { position: absolute; left: 0; top: 610px; width: 1920px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 28px;
      letter-spacing: 0.2em; color: #9a9288; }
    #ring-top { position: absolute; left: 0; top: 140px; width: 1920px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 28px;
      letter-spacing: 0.18em; color: #b9b1a4; text-transform: uppercase; }
    #ring-top b { color: #e8a33d; font-weight: 500; }
    #ring-bot { position: absolute; left: 0; top: 860px; width: 1920px; text-align: center; font-family: "Fraunces", serif; font-weight: 300;
      font-size: 60px; letter-spacing: -0.02em; color: #ede6da; }
    #ring-bot em { color: #e8a33d; }
  </style>
  <div id="root" data-composition-id="ring" data-width="1920" data-height="1080">
    <div id="ring-ground" data-layout-ignore></div>
    <div id="ring-cam" data-layout-allow-overflow>
      <svg id="ring-svg" viewBox="0 0 1920 1080">
        <defs>
          <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e8a33d" />
            <stop offset="1" stop-color="#d2592b" />
          </linearGradient>
        </defs>
        <circle id="ring-track" cx="960" cy="520" r="230" />
        <circle id="ring-arc" cx="960" cy="520" r="230" transform="rotate(-90 960 520)" />
      </svg>
      <div id="ring-num">0.000</div>
      <div id="ring-lbl">P(ANOMALOUS)</div>
    </div>
    <div id="ring-top">segment <b>#204</b> · label hidden from the model</div>
    <div id="ring-bot">TabPFN-v2: <em>prioritise.</em></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const C = 2 * Math.PI * 230;
    // the pulse from the last scene grows into the ring
    tl.fromTo("#ring-cam", { scale: 0.05, transformOrigin: "960px 520px" }, { scale: 1, duration: 0.45, ease: "expo.out" }, 0);
    tl.fromTo("#ring-top", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 0.25);
    // TabPFN's probability for segment #204, as the console shows it: 1.000
    const val = { p: 0 };
    const num = document.querySelector("#ring-num");
    tl.fromTo("#ring-arc", { strokeDasharray: C, strokeDashoffset: C }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 0.3);
    tl.fromTo(val, { p: 0 }, { p: 1, duration: 1.3, ease: "power2.inOut", onUpdate: () => { num.textContent = val.p.toFixed(3); } }, 0.3);
    tl.fromTo("#ring-bot", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 1.3);
    // zoom through the ring's hole into the live console
    tl.to("#ring-num, #ring-lbl, #ring-top, #ring-bot", { opacity: 0, filter: "blur(10px)", duration: 0.16 }, 2.48);
    tl.to("#ring-cam", { scale: 8.5, duration: 0.6, ease: "power2.in" }, 2.56);
    tl.fromTo("#ring-ground", { "--hole": "0px" }, { "--hole": "1900px", duration: 0.6, ease: "power2.in" }, 2.56);
    window.__timelines["ring"] = tl;
  </script>
</template>
