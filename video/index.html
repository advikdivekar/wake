<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #050507; --ink: #f6e7c1; --accent: #e8a33d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #ground { position: absolute; inset: 0; background: var(--ground); z-index: 0; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="63.1" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <!-- 1 hook: every OPS-SAT channel at once (real telemetry) -->
      <div id="chaos" class="scene" style="z-index:2" data-composition-id="chaos" data-composition-src="compositions/chaos.html"
        data-start="0" data-duration="6.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 2 one segment, measured and cited -->
      <div id="converge" class="scene" style="z-index:2" data-composition-id="converge" data-composition-src="compositions/converge.html"
        data-start="6.2" data-duration="4.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 3 TabPFN's ring; the camera dives through it into the console -->
      <div id="ring" class="scene" style="z-index:3" data-composition-id="ring" data-composition-src="compositions/ring.html"
        data-start="11" data-duration="3.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 4 reveal: the live console -->
      <div id="hero" class="scene" style="z-index:2" data-composition-id="hero" data-composition-src="compositions/hero.html"
        data-start="13.6" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 5-11 proof, in the real UI -->
      <div id="hide" class="scene" style="z-index:2" data-composition-id="hide" data-composition-src="compositions/hide.html"
        data-start="19.2" data-duration="8.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="miss" class="scene" style="z-index:2" data-composition-id="miss" data-composition-src="compositions/miss.html"
        data-start="27.4" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="queue" class="scene" style="z-index:2" data-composition-id="queue" data-composition-src="compositions/queue.html"
        data-start="31.8" data-duration="4.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="number" class="scene" style="z-index:3" data-composition-id="number" data-composition-src="compositions/number.html"
        data-start="36.2" data-duration="3.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="lab" class="scene" style="z-index:2" data-composition-id="lab" data-composition-src="compositions/lab.html"
        data-start="39.6" data-duration="2.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="tinker" class="scene" style="z-index:2" data-composition-id="tinker" data-composition-src="compositions/tinker.html"
        data-start="42.4" data-duration="6.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="memory" class="scene" style="z-index:2" data-composition-id="memory" data-composition-src="compositions/memory.html"
        data-start="49" data-duration="4.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- 12 claim, 13 the console's own last line, 14 end card -->
      <div id="claim" class="scene" style="z-index:2" data-composition-id="claim" data-composition-src="compositions/claim.html"
        data-start="53.6" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="finale" class="scene" style="z-index:2" data-composition-id="finale" data-composition-src="compositions/finale.html"

      <div id="endcard" class="scene" style="z-index:2" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="59" data-duration="4.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <audio id="sfx-swap3" class="clip" data-duration="0.37" data-start="4.45" data-track-index="30" data-volume="0.35" src="assets/sfx/click-soft.mp3"></audio>

      <audio id="sfx-br1" class="clip" data-duration="0.72" data-start="8.3" data-track-index="32" data-volume="0.3" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-br2" class="clip" data-duration="0.37" data-start="8.62" data-track-index="33" data-volume="0.26" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-br3" class="clip" data-duration="0.72" data-start="8.94" data-track-index="38" data-volume="0.3" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-through" class="clip" data-duration="0.57" data-start="13.55" data-track-index="31" data-volume="0.5" src="assets/sfx/whoosh.mp3"></audio>

      <audio id="sfx-click1" class="clip" data-duration="0.37" data-start="21.45" data-track-index="35" data-volume="0.55" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-click2" class="clip" data-duration="0.37" data-start="25.52" data-track-index="35" data-volume="0.55" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-tp" class="clip" data-duration="0.72" data-start="25.9" data-track-index="32" data-volume="0.4" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-click3" class="clip" data-duration="0.37" data-start="29.94" data-track-index="35" data-volume="0.55" src="assets/sfx/click.mp3"></audio>

      <audio id="sfx-flood" class="clip" data-duration="0.57" data-start="36.15" data-track-index="31" data-volume="0.45" src="assets/sfx/whoosh.mp3"></audio>

      <audio id="sfx-row1" class="clip" data-duration="0.4" data-start="43.4" data-track-index="37" data-volume="0.4" src="assets/sfx/key-press.mp3"></audio>

      <audio id="sfx-row3" class="clip" data-duration="0.4" data-start="44.24" data-track-index="37" data-volume="0.4" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-worse" class="clip" data-duration="1.62" data-start="44.7" data-track-index="36" data-volume="0.32" src="assets/sfx/error.mp3"></audio>
      <audio id="sfx-typing" class="clip" data-duration="1.5" data-start="50.2" data-track-index="37" data-volume="0.35" src="assets/sfx/typing.mp3"></audio>
      <audio id="sfx-mark" class="clip" data-duration="2.59" data-start="59.75" data-track-index="34" data-volume="0.6" src="assets/sfx/impact-bass-2.mp3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
