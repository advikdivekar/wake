# Swap components without code changes. See docs/replaceability.md.
language_model:
  backend: llamacpp            # llamacpp | tinker | template (template = no-LM fallback)
  base_model: Qwen/Qwen3-8B
  gguf: models/Qwen3-8B-Q4_K_M.gguf
  adapter: models/adapter.gguf
  server: http://localhost:8081
  tinker_model_path: tinker://ecf1c236-b8b8-5cec-8a4b-9558bf4dce0f:train:0/sampler_weights/final-v2-ep3   # final-v2, epoch 3
tabular_classifier:
  backend: tabpfn              # tabpfn | xgboost | rf | lr
  path: models/tabpfn_final.pkl
thresholds:                    # from training/tabpfn/threshold.py (OOF)
  high: 0.8
  low: 0.05
  f1: 0.6169
retrieval:
  embedding_model: BAAI/bge-small-en-v1.5
  fusion: rrf
  k: 6
